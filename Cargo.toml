[package]
name = "dplayer"
version = "0.1.0"
edition = "2021"
authors = ["Sammwy"]
license = "Apache-2.0"
description = "A native video and music player for Linux"
repository = "https://github.com/sammwyy/dplayer"
homepage = "https://github.com/sammwyy/dplayer"
readme = "README.md"
keywords = ["media-player", "video", "music", "native", "linux"]
categories = ["multimedia", "gui"]

[[bin]]
name = "dplayer"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rodio = "0.23"
creamui-image = { path = "../creamui/crates/image", features = ["svg", "jpeg", "webp"] }
creamui-core = { path = "../creamui/crates/core" }
creamui-reactive = { path = "../creamui/crates/reactive" }
creamui-render = { path = "../creamui/crates/render", default-features = false, features = ["system-theme", "logger"] }
creamui-theme = { path = "../creamui/crates/theme" }
creamui-theme-loader = { path = "../creamui/crates/theme-loader" }
creamui-theme-watch = { path = "../creamui/crates/theme-watch" }
creamui-fonts = { path = "../creamui/crates/fonts" }
creamui-widgets = { path = "../creamui/crates/widgets" }
toml = "0.9"
delib = { version = "0.1.0", path = "../delib" }
libloading = "=0.8.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
dbus = "0.9"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
creamui-render = { path = "../creamui/crates/render", default-features = false, features = ["platform-winit", "platform-wayland", "platform-x11", "platform-window-integration-blair", "platform-blur-blair", "platform-blur-kwin"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = "0.17"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.52", features = [
    "Foundation",
    "Media",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_UI_WindowsAndMessaging",
] }
creamui-render = { path = "../creamui/crates/render", default-features = false, features = ["platform-winit", "platform-windows"] }

[profile.dev]
debug = 0
